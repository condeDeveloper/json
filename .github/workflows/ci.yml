name: testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ${{ matrix.so }}

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # O juiz e o System.Text.Json da propria maquina, entao a matriz de tres
      # sistemas testa contra tres builds diferentes dele.
      - name: testes
        run: dotnet test testes/Json.Testes/Json.Testes.csproj --nologo -v q

      # O placar exige 100% nos dois sentidos: o que ele aceita eu aceito, e o
      # que ele recusa eu recuso.
      - name: o placar
        run: dotnet run --project ferramentas/Placar/Placar.csproj -c Release --nologo -- 10000
